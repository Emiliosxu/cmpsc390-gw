<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

<style>
body {
    background: linear-gradient(135deg, #06194e, #2D83A6, #4c07c3);
    color: white;
    padding: 20px;
}

.card {
    background: rgba(255,255,255,0.15);
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<h1 class="text-center">Search Clothing</h1>

<div class="container">
    <input type="text" id="searchInput" class="form-control"
        placeholder="Search (Casual, Formal, Work, Everyday)">
</div>

<div id="results" class="row mt-4"></div>

<script>
const input = document.getElementById("searchInput");

// Function to fetch and display results
function performSearch() {
    let query = input.value;

    fetch("http://localhost:3000/search?q=" + encodeURIComponent(query))
        .then(res => res.json())
        .then(data => {
            let output = "";
            if (data.length === 0) {
                output = '<div class="col-12 text-center"><p>No items found</p></div>';
            } else {
                data.forEach(item => {
                    output += `
                        <div class="col-md-3">
                            <div class="card">
                                <img src="${item.image_url || 'https://via.placeholder.com/300x200?text=No+Image'}" style="width:100%; height:150px; object-fit:cover;">
                                <h5>${item.item_name || 'Unknown'}</h5>
                                <p>Style: ${item.style || 'N/A'}</p>
                                <p>Use: ${item.occasion || 'N/A'}</p>
                                <p>$${item.price || '0.00'}</p>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById("results").innerHTML = output;
        })
        .catch(error => {
            console.error('Search error:', error);
            document.getElementById("results").innerHTML = '<div class="col-12 text-center text-danger">Error performing search</div>';
        });
}

// Listen for Enter key
input.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        performSearch();
    }
});

// Also keep keyup for real-time search if you want
input.addEventListener("keyup", function(event) {
    // Don't search on every keyup if you want Enter-only behavior
    // Uncomment below if you want real-time search
    // performSearch();
});
</script>

</body>
</html>
