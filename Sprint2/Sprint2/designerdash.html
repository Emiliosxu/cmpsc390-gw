<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Designer Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #06194e, #2D83A6, #4c07c3);
            background-size: 300% 300%;
            animation: gradientMove 10s ease infinite;
            font-family: 'Raleway', sans-serif;
            color: #F0F0F2;
            margin: 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .navbar {
            background-color: rgb(35, 39, 96);
            padding: 10px;
            text-align: center;
            border-radius: 12px;
        }

        .navbar a {
            color: #dce7ff;
            text-decoration: none;
            margin: 0 12px;
        }

        .navbar a:hover {
            color: white;
        }

        .container-flex {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            padding: 20px;
            min-height: 100vh;
            backdrop-filter: blur(10px);
        }

        .dashboard-card {
            width: 320px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            color: white;
            transition: 0.3s;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        .dashboard-btn {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            background-color: #4e73df;
            color: white;
            border: none;
            cursor: pointer;
        }

        .dashboard-btn:hover {
            background-color: #6a8cff;
            transform: scale(1.02);
        }

        .secondary-btn {
            background-color: rgba(255,255,255,0.15);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #092b8f;
        }

        .analytics-panel {
            width: 360px;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 15px;
        }

        .stat-title {
            font-size: 13px;
            color: #dbe7ff;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
        }

        .full-width {
            grid-column: span 2;
        }

        .last-updated {
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html">Home</a> |
        <a href="aboutus.html">About</a> |
        <a href="contact.html">Contact</a> |
        <a href="login.html">Login</a> |
        <a href="designerdash.html?brand_name=UrbanStyle">Dashboard</a>
    </nav>

    <div class="container-flex">

        <!-- PROFILE -->
        <div class="dashboard-card">
            <img src="https://via.placeholder.com/150" class="profile-img">
            <h4 id="designer-name">Loading...</h4>
            <p>Designer</p>

            <button class="dashboard-btn">Profile</button>
            <button class="dashboard-btn">Settings</button>
        </div>

        <!-- DESIGNER -->
        <div class="dashboard-card">
            <h3>Designer Dashboard</h3>
            <p>Manage your projects</p>

            <button class="dashboard-btn">Create Project</button>
            <button class="dashboard-btn">View Projects</button>
            <button class="dashboard-btn" onclick="loadAnalytics()">Analytics</button>
        </div>

        <!-- ANALYTICS -->
        <div class="dashboard-card analytics-panel" id="analytics-card" style="display:none;">
            <h3>Analytics</h3>

            <div class="analytics-grid">
                <div class="stat-box">
                    <div class="stat-title">Items Sold</div>
                    <div class="stat-value" id="items-sold">-</div>
                </div>

                <div class="stat-box">
                    <div class="stat-title">Revenue</div>
                    <div class="stat-value">$<span id="total-revenue">-</span></div>
                </div>

                <div class="stat-box full-width">
                    <div class="stat-title">Inventory Left</div>
                    <div class="stat-value" id="inventory-left">-</div>
                </div>
            </div>

            <p id="analytics-summary" class="last-updated"></p>
            <p id="last-updated" class="last-updated"></p>

            <button class="dashboard-btn" onclick="loadAnalytics()">Refresh</button>
            <button class="dashboard-btn secondary-btn" onclick="hideAnalytics()">Hide</button>
        </div>

    </div>

<script>
function loadBrandName() {
    const params = new URLSearchParams(window.location.search);
    const brandName = params.get("brand_name");

    document.getElementById("designer-name").textContent = brandName || "UrbanStyle";
}

async function loadAnalytics() {
    const card = document.getElementById("analytics-card");
    const summary = document.getElementById("analytics-summary");
    const updated = document.getElementById("last-updated");

    card.style.display = "block";

    try {
        const res = await fetch("http://localhost:3000/designer/analytics");
        const data = await res.json();

        document.getElementById("items-sold").textContent = data.items_sold;
        document.getElementById("total-revenue").textContent = data.total_revenue;
        document.getElementById("inventory-left").textContent = data.inventory_left;

        summary.textContent = data.items_sold > 5
            ? "Sales are doing well! 📈"
            : "Sales are still growing! 📈";


    } catch {
        summary.textContent = "Error loading analytics";
        updated.textContent = "";
    }
}

function hideAnalytics() {
    document.getElementById("analytics-card").style.display = "none";
}

document.addEventListener("DOMContentLoaded", loadBrandName);
</script>

</body>
</html>
