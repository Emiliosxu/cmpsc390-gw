<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>STYLIX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            src: url(fonts/YAGIZA__.TTF);
            font-family: YAGIZA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Space Mono', 'Share Tech Mono', monospace;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 0;
        }

        .crt-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px);
        }

        html {
            scroll-behavior: smooth;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            z-index: 1000;
            border-bottom: 1px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .navbar-left .logo {
            font-family: 'YAGIZA', 'Share Tech Mono', monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 4px;
            text-shadow: 0 0 5px #ffffff;
        }

        .navbar-left .logo span {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .navbar-left a,
        .navbar-right a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
            position: relative;
        }

        .navbar-left a::before,
        .navbar-right a::before {
            content: '>';
            position: absolute;
            left: -12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .navbar-left a:hover::before,
        .navbar-right a:hover::before {
            opacity: 1;
        }

        .navbar-left a:hover,
        .navbar-right a:hover {
            color: #00ffff;
            padding-left: 8px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            padding: 5px 5px 5px 15px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .search-icon {
            color: #ffffff;
            font-size: 0.9rem;
        }

        .search-input {
            background: transparent;
            border: none;
            padding: 8px 10px;
            color: #ffffff;
            font-size: 0.85rem;
            width: 180px;
            outline: none;
            font-family: 'Space Mono', monospace;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-action-btn {
            background: #ffffff;
            border: none;
            color: #0a0a0a;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.3s ease;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-action-btn:hover {
            background: #ff00ff;
            color: #0a0a0a;
            box-shadow: 0 0 10px #ff00ff;
        }

        .user-dropdown {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .greeting-text {
            color: #ffffff;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 10px;
            background: #0a0a0a;
            min-width: 140px;
            border: 1px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 1000;
            overflow: hidden;
        }

        .dropdown-content a {
            color: #ffffff;
            padding: 12px 20px;
            display: block;
            font-size: 0.8rem;
        }

        .dropdown-content a:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ff00ff;
        }

        .user-dropdown:hover .dropdown-content {
            display: block;
        }

        #cart-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .section-header {
            text-align: center;
            margin: 100px 0 40px;
            position: relative;
            z-index: 1;
        }

        .section-header h2 {
            font-size: 2rem;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 10px;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .section-header .accent-line {
            width: 80px;
            height: 2px;
            background: #ff00ff;
            margin: 15px auto 0;
            box-shadow: 0 0 5px #ff00ff;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            padding: 0 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .card {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #ffffff;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .card-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            filter: grayscale(20%) contrast(110%);
            transition: all 0.5s ease;
        }

        .card:hover .card-img {
            filter: grayscale(0%) contrast(120%);
        }

        .card-content {
            padding: 20px;
        }

        .card h3 {
            font-size: 0.95rem;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: #ffffff;
            letter-spacing: 1px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
        }

        .designer-name {
            color: #ffffff;
            margin: 5px 0;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Share Tech Mono', monospace;
        }

        .item-price {
            color: #ffffff;
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
        }

        .card-buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn {
            flex: 1;
            padding: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            transition: all 0.3s;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #ffffff;
            color: #0a0a0a;
            border-color: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }

        .like-btn {
            border-color: #ffffff;
            color: #ffffff;
        }

        .like-btn:hover {
            background: #ff00ff;
            color: #0a0a0a;
            box-shadow: 0 0 10px #ff00ff;
        }

        .no-results {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #ffffff;
        }

        .footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #ffffff;
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        @media(max-width: 1200px) {
            .content-grid {
                grid-template-columns: repeat(3, 1fr);
                padding: 0 30px;
            }
        }

        @media(max-width: 900px) {
            .content-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .navbar {
                padding: 12px 20px;
            }

            .navbar-left {
                gap: 20px;
            }

            .navbar-left .logo {
                font-size: 1.4rem;
            }
        }

        @media(max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 12px;
            }

            .navbar-left,
            .navbar-right {
                flex-wrap: wrap;
                justify-content: center;
            }

            .search-container {
                width: 100%;
            }

            .search-input {
                flex-grow: 1;
                width: auto;
            }

            .content-grid {
                grid-template-columns: 1fr;
                padding: 0 20px;
            }

            .card-img {
                height: 280px;
            }
        }
    </style>
</head>

<body>

    <div class="crt-effect"></div>

    <nav class="navbar">
        <div class="navbar-left">
            <a href="index.html" class="logo">STYLIX</a>
            <a href="index.html">HOME</a>
            <a href="shoptest.html">SHOP</a>
            <a href="aboutus.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
            <a href="exploreDesigners.html">DESIGNERS</a>
            <a href="userdash.html" id="my-closet-link" style="display: none;">USERDASH</a>
        </div>
        <div class="navbar-right">
            <a href="checkout.html" id="cart-btn"><i class="fas fa-shopping-cart"></i> CART</a>
            <div class="search-container">
                <span class="search-icon"><i class="fas fa-search"></i></span>
                <input type="text" id="searchInput" class="search-input" placeholder="SEARCH DESIGNER...">
                <button id="searchActionBtn" class="search-action-btn">[GO]</button>
            </div>
            <div class="user-dropdown" id="user-dropdown" style="display: none;">
                <span class="greeting-text" id="user-greeting">Hello, USER</span>
                <div class="dropdown-content">
                    <a href="#" id="logout-link">[LOGOUT]</a>
                </div>
            </div>
            <a href="login.html" id="login-link">LOGIN</a>
            <a href="register.html" id="register-link">[SIGNUP]</a>
        </div>
    </nav>

    <div class="section-header">
        <h2>EXPLORE DESIGNERS</h2>
        <div class="accent-line"></div>
    </div>

    <div id="designerGrid" class="content-grid"></div>

    <script>
        const searchInput = document.getElementById("searchInput");
        const searchActionBtn = document.getElementById("searchActionBtn");

        searchActionBtn.addEventListener("click", searchDesigners);

        searchInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                searchDesigners();
            }
        });

        async function searchDesigners() {
            const query = searchInput.value;
            const res = await fetch(`/designer/search?query=${encodeURIComponent(query)}`);
            const designers = await res.json();
            const grid = document.getElementById("designerGrid");

            if (designers.length === 0) {
                grid.innerHTML = `<div class="no-results">> NO_DESIGNERS_FOUND</div>`;
                return;
            }

            grid.innerHTML = designers.map(d => `
                <div class="card">
                    <img class="card-img" src="https://via.placeholder.com/300x400" />
                    <div class="card-content">
                        <h3>${d.brand_name}</h3>
                        <p class="designer-name">ID: ${d.designer_id}</p>
                        <p class="item-price">${d.email}</p>
                        <div class="card-buttons">
                            <button class="btn" onclick="viewDesigner(${d.designer_id})">View Profile</button>
                            <button class="btn like-btn">Follow</button>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        function viewDesigner(id) {
            window.location.href = `searchDesignerProfile.html?id=${id}`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            searchDesigners();

            const logoutLink = document.getElementById("logout-link");
            if (logoutLink) {
                logoutLink.addEventListener("click", async function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    try {
                        const res = await fetch("/logout", { method: "POST" });
                        const data = await res.json();
                        if (data.success) {
                            window.location.href = "/";
                        }
                    } catch (error) {
                        console.error("Logout error:", error);
                    }
                });
            }
        });
    </script>

</body>

</html>
