<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STYLIX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    @font-face {
        src: url(fonts/YAGIZA__.TTF);
        font-family: YAGIZA;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #0a0a0a;
        font-family: 'Space Mono', 'Share Tech Mono', monospace;
        color: #ffffff;
        margin: 0;
        overflow-x: hidden;
        position: relative;
        min-height: 100vh;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 20px 20px;
        pointer-events: none;
        z-index: 0;
    }

    .crt-effect {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        background: repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.15),
            rgba(0, 0, 0, 0.15) 1px,
            transparent 1px,
            transparent 2px
        );
    }

    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
        padding: 15px 40px;
        z-index: 1000;
        border-bottom: 1px solid #ffffff;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .navbar-left {
        display: flex;
        align-items: center;
        gap: 30px;
    }

    .navbar-left .logo {
        font-family: 'YAGIZA', 'Share Tech Mono', monospace;
        font-size: 1.8rem;
        font-weight: bold;
        color: #ffffff;
        text-decoration: none;
        letter-spacing: 4px;
        text-shadow: 0 0 5px #ffffff;
    }

    .navbar-left .logo span {
        color: #ff00ff;
        text-shadow: 0 0 5px #ff00ff;
    }

    .navbar-left a, .navbar-right a {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: 'Share Tech Mono', monospace;
        letter-spacing: 1px;
        position: relative;
    }

    .navbar-left a::before, .navbar-right a::before {
        content: '>';
        position: absolute;
        left: -12px;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .navbar-left a:hover::before, .navbar-right a:hover::before {
        opacity: 1;
    }

    .navbar-left a:hover, .navbar-right a:hover {
        color: #ff00ff;
        padding-left: 8px;
    }

    .navbar-right {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    .search-container {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #ffffff;
        padding: 5px 5px 5px 15px;
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }

    .search-icon {
        color: #ffffff;
        font-size: 0.9rem;
    }

    .search-input {
        background: transparent;
        border: none;
        padding: 8px 10px;
        color: #ffffff;
        font-size: 0.85rem;
        width: 180px;
        outline: none;
        font-family: 'Space Mono', monospace;
    }

    .search-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    .search-action-btn {
        background: #ffffff;
        border: none;
        color: #0a0a0a;
        padding: 6px 16px;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 700;
        transition: all 0.3s ease;
        font-family: 'Share Tech Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .search-action-btn:hover {
        background: #ff00ff;
        color: #0a0a0a;
        box-shadow: 0 0 10px #ff00ff;
    }

    .user-dropdown {
        position: relative;
        display: inline-block;
        cursor: pointer;
    }

    .greeting-text {
        color: #ffffff;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #ffffff;
        font-size: 0.85rem;
        font-family: 'Space Mono', monospace;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        margin-top: 10px;
        background: #0a0a0a;
        min-width: 140px;
        border: 1px solid #ffffff;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        z-index: 1000;
        overflow: hidden;
    }

    .dropdown-content a {
        color: #ffffff;
        padding: 12px 20px;
        display: block;
        font-size: 0.8rem;
    }

    .dropdown-content a:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #ff00ff;
    }

    .user-dropdown:hover .dropdown-content {
        display: block;
    }

    #cart-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
    }

    .page-header {
        text-align: center;
        margin: 100px 0 40px;
        position: relative;
        z-index: 1;
    }

    .page-header h1 {
        font-size: 2.5rem;
        font-weight: 400;
        color: #ffffff;
        font-family: 'Share Tech Mono', monospace;
        letter-spacing: 4px;
        text-transform: uppercase;
    }

    .page-header .accent-line {
        width: 80px;
        height: 2px;
        background: #ff00ff;
        margin: 15px auto 0;
        box-shadow: 0 0 5px #ff00ff;
    }

    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60vh;
        position: relative;
        z-index: 1;
        padding: 20px;
    }

    .login-form {
        background: rgba(10, 10, 10, 0.95);
        border: 1px solid #ffffff;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .login-form:hover {
        border-color: #ff00ff;
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
    }

    .login-form h3 {
        font-family: 'Share Tech Mono', monospace;
        font-size: 1.5rem;
        color: #ff00ff;
        margin-bottom: 30px;
        letter-spacing: 2px;
    }

    .input-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .input-group label {
        font-size: 0.75rem;
        color: #ffffff;
        display: block;
        margin-bottom: 8px;
        font-family: 'Space Mono', monospace;
        letter-spacing: 1px;
    }

    .input-group input {
        width: 100%;
        padding: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #ffffff;
        color: #ffffff;
        font-family: 'Space Mono', monospace;
        font-size: 0.85rem;
        outline: none;
        transition: all 0.3s;
    }

    .input-group input:focus {
        border-color: #ff00ff;
        box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background: transparent;
        border: 1px solid #ffffff;
        color: #ffffff;
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
    }

    .login-btn:hover {
        background: #ff00ff;
        color: #0a0a0a;
        border-color: #ff00ff;
        box-shadow: 0 0 10px #ff00ff;
    }

    .register-link {
        margin-top: 20px;
        font-size: 0.75rem;
        color: rgba(255,255,255,0.6);
    }

    .register-link a {
        color: #ff00ff;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    .error-message {
        background: rgba(255, 0, 0, 0.2);
        border: 1px solid #ff0000;
        padding: 10px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 0.75rem;
        color: #ff6666;
        display: none;
    }

    @media(max-width: 768px) {
        .navbar {
            flex-direction: column;
            gap: 12px;
            padding: 12px 20px;
        }
        .navbar-left, .navbar-right {
            flex-wrap: wrap;
            justify-content: center;
        }
        .search-container {
            width: 100%;
        }
        .search-input {
            flex-grow: 1;
            width: auto;
        }
        .page-header {
            margin-top: 140px;
        }
        .page-header h1 {
            font-size: 1.8rem;
        }
        .login-form {
            padding: 30px;
            margin: 20px;
        }
    }
</style>
</head>
<body>

<div class="crt-effect"></div>

<nav class="navbar">
    <div class="navbar-left">
        <a href="/" class="logo">STYLIX</a>
        <a href="/">HOME</a>
        <a href="/shoptest.html">SHOP</a>
        <a href="/exploreDesigners.html">DESIGNERS</a>
        <a href="/aboutus.html">ABOUT</a>
        <a href="/contact.html">CONTACT</a>
        <a href="#" id="dashboard-link" style="display: none;">MY CLOSET</a>
    </div>
    <div class="navbar-right">
        <a href="checkout.html" id="cart-btn"><i class="fas fa-shopping-cart"></i> CART</a>
        <div class="search-container">
            <span class="search-icon"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" class="search-input" placeholder="SEARCH...">
            <button id="searchActionBtn" class="search-action-btn" onclick="performSearch()">[GO]</button>
        </div>
        <div class="user-dropdown" id="user-dropdown" style="display: none;">
            <span class="greeting-text" id="user-greeting">Hello, USER</span>
            <div class="dropdown-content">
                <a href="#" id="logout-link">[LOGOUT]</a>
            </div>
        </div>
        <a href="/login.html" id="login-link">LOGIN</a>
        <a href="/register.html" id="register-link">[SIGNUP]</a>
    </div>
</nav>

<div class="page-header">
    <h1>LOGIN</h1>
    <div class="accent-line"></div>
</div>

<div class="login-container">
    <div class="login-form">
        <h3>LOGIN</h3>
        
        <div id="error-message" class="error-message"></div>
        
        <form id="loginForm">
            <div class="input-group">
                <label>EMAIL:</label>
                <input type="email" id="email" placeholder="user@example.com" required>
            </div>
            <div class="input-group">
                <label>PASSWORD:</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="submit" class="login-btn">[ ACCESS ]</button>
        </form>
        <div class="register-link">
            NO ACCOUNT? <a href="/register.html">REGISTER NOW</a>
        </div>
    </div>
</div>

<script>
let currentUser = null;
const searchInput = document.getElementById("searchInput");

function performSearch() {
    const query = searchInput.value;
    if (query && query.trim() !== "") {
        window.location.href = `/shoptest.html?search=${encodeURIComponent(query)}`;
    }
}

searchInput?.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        performSearch();
    }
});

const searchActionBtn = document.getElementById("searchActionBtn");
if (searchActionBtn) {
    searchActionBtn.addEventListener("click", function() {
        performSearch();
    });
}

async function checkLoginStatus() {
    try {
        const res = await fetch("/check-session");
        const data = await res.json();
        
        if (data.loggedIn) {
            currentUser = data;
            document.getElementById("login-link").style.display = "none";
            document.getElementById("register-link").style.display = "none";
            
            if (data.accountType === 'designer') {
                document.getElementById("my-closet-link").style.display = "none";
                document.getElementById("cart-btn").style.display = "none";
                document.getElementById("user-greeting").textContent = `DESIGNER, ${data.userName.toUpperCase()}`;
                window.location.href = "/designerdash.html";
            } else {
                document.getElementById("my-closet-link").style.display = "inline";
                document.getElementById("cart-btn").style.display = "inline";
                document.getElementById("user-greeting").textContent = `Hello, ${data.userName.toUpperCase()}`;
                window.location.href = "/";
            }
            
            document.getElementById("user-dropdown").style.display = "inline-block";
        } else {
            currentUser = null;
            document.getElementById("login-link").style.display = "inline";
            document.getElementById("register-link").style.display = "inline";
            document.getElementById("my-closet-link").style.display = "none";
            document.getElementById("user-dropdown").style.display = "none";
        }
    } catch (error) {
        console.error("Error checking login status:", error);
    }
}

document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    
    const errorDiv = document.getElementById("error-message");
    errorDiv.style.display = "none";
    
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
    });

    const data = await response.json();
    
    if (data.success) {
        alert(`Logged in, Welcome ${data.userName.toUpperCase()}`);
        
        if (data.accountType === 'designer') {
            window.location.href = "/designerdash.html";
        } else {
            window.location.href = "/";
        }
    } else {
        errorDiv.textContent = "Invalid credentials";
        errorDiv.style.display = "block";
    }
});

document.addEventListener("DOMContentLoaded", function() {
    const logoutLink = document.getElementById("logout-link");
    if (logoutLink) {
        logoutLink.addEventListener("click", async function(e) {
            e.preventDefault();
            e.stopPropagation();
            try {
                const res = await fetch("/logout", { method: "POST" });
                const data = await res.json();
                if (data.success) {
                    window.location.reload();
                }
            } catch (error) {
                console.error("Logout error:", error);
            }
        });
    }
});

checkLoginStatus();
</script>
</body>
</html>
