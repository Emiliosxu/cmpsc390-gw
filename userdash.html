<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STYLIX</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    @font-face {
        src: url(fonts/YAGIZA__.TTF);
        font-family: YAGIZA;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #0a0a0a;
        font-family: 'Space Mono', 'Share Tech Mono', monospace;
        color: #ffffff;
        margin: 0;
        overflow-x: hidden;
        position: relative;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 20px 20px;
        pointer-events: none;
        z-index: 0;
    }

    .crt-effect {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        background: repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.15),
            rgba(0, 0, 0, 0.15) 1px,
            transparent 1px,
            transparent 2px
        );
    }

    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
        padding: 15px 40px;
        z-index: 1000;
        border-bottom: 1px solid #ffffff;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .navbar-left {
        display: flex;
        align-items: center;
        gap: 30px;
    }

    .navbar-left .logo {
        font-family: 'YAGIZA', 'Share Tech Mono', monospace;
        font-size: 1.8rem;
        font-weight: bold;
        color: #ffffff;
        text-decoration: none;
        letter-spacing: 4px;
        text-shadow: 0 0 5px #ffffff;
    }

    .navbar-left .logo span {
        color: #ff00ff;
        text-shadow: 0 0 5px #ff00ff;
    }

    .navbar-left a, .navbar-right a {
        color: #ffffff;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: 'Share Tech Mono', monospace;
        letter-spacing: 1px;
        position: relative;
    }

    .navbar-left a::before, .navbar-right a::before {
        content: '>';
        position: absolute;
        left: -12px;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .navbar-left a:hover::before, .navbar-right a:hover::before {
        opacity: 1;
    }

    .navbar-left a:hover, .navbar-right a:hover {
        color: #ff00ff;
        padding-left: 8px;
    }

    .navbar-right {
        display: flex;
        align-items: center;
        gap: 25px;
    }

    .search-container {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #ffffff;
        padding: 5px 5px 5px 15px;
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }

    .search-icon {
        color: #ffffff;
        font-size: 0.9rem;
    }

    .search-input {
        background: transparent;
        border: none;
        padding: 8px 10px;
        color: #ffffff;
        font-size: 0.85rem;
        width: 180px;
        outline: none;
        font-family: 'Space Mono', monospace;
    }

    .search-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    .search-action-btn {
        background: #ffffff;
        border: none;
        color: #0a0a0a;
        padding: 6px 16px;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 700;
        transition: all 0.3s ease;
        font-family: 'Share Tech Mono', monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .search-action-btn:hover {
        background: #ff00ff;
        color: #0a0a0a;
        box-shadow: 0 0 10px #ff00ff;
    }

    .user-dropdown {
        position: relative;
        display: inline-block;
        cursor: pointer;
    }

    .greeting-text {
        color: #ffffff;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #ffffff;
        font-size: 0.85rem;
        font-family: 'Space Mono', monospace;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        margin-top: 10px;
        background: #0a0a0a;
        min-width: 140px;
        border: 1px solid #ffffff;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        z-index: 1000;
        overflow: hidden;
    }

    .dropdown-content a {
        color: #ffffff;
        padding: 12px 20px;
        display: block;
        font-size: 0.8rem;
    }

    .dropdown-content a:hover {
        background: rgba(255, 255, 255, 0.2);
        color: #ff00ff;
    }

    .user-dropdown:hover .dropdown-content {
        display: block;
    }

    #cart-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
    }

    .page-header {
        text-align: center;
        margin: 100px 0 40px;
        position: relative;
        z-index: 1;
    }

    .page-header h1 {
        font-size: 2.5rem;
        font-weight: 400;
        color: #ffffff;
        font-family: 'Share Tech Mono', monospace;
        letter-spacing: 4px;
        text-transform: uppercase;
    }

    .page-header .accent-line {
        width: 80px;
        height: 2px;
        background: #ff00ff;
        margin: 15px auto 0;
        box-shadow: 0 0 5px #ff00ff;
    }

    .dashboard-container {
        display: flex;
        gap: 30px;
        padding: 20px 40px 60px;
        max-width: 1400px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
        flex-wrap: wrap;
    }

    .dashboard-left {
        flex: 1;
        min-width: 300px;
    }

    .dashboard-right {
        width: 350px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .dashboard-card {
        background: rgba(10, 10, 10, 0.9);
        border: 1px solid #ffffff;
        padding: 30px;
        transition: all 0.3s ease;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        text-align: center;
    }

    .dashboard-card:hover {
        border-color: #ff00ff;
        box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        transform: translateY(-5px);
    }

    .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #ff00ff;
        margin-bottom: 20px;
    }

    .user-name {
        font-size: 1.2rem;
        color: #ff00ff;
        margin-bottom: 5px;
        font-family: 'Share Tech Mono', monospace;
    }

    .user-role {
        font-size: 0.7rem;
        color: rgba(255,255,255,0.6);
        margin-bottom: 20px;
        letter-spacing: 2px;
    }

    .dashboard-btn {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        background: transparent;
        border: 1px solid #ffffff;
        color: #ffffff;
        font-family: 'Share Tech Mono', monospace;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .dashboard-btn:hover {
        background: #ff00ff;
        color: #0a0a0a;
        border-color: #ff00ff;
        box-shadow: 0 0 10px #ff00ff;
    }

    .liked-closet-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-top: 20px;
    }

    .liked-item-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 15px;
        text-align: center;
        transition: all 0.3s;
    }

    .liked-item-card:hover {
        border-color: #ff00ff;
        transform: translateY(-3px);
    }

    .liked-item-img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        margin-bottom: 10px;
    }

    .liked-item-name {
        font-size: 0.75rem;
        color: #ffffff;
        margin: 5px 0;
    }

    .designer-name {
        font-size: 0.65rem;
        color: #ff00ff;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .checkout-item {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
        padding: 5px 0;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        font-size: 0.75rem;
    }

    .checkout-total {
        display: flex;
        justify-content: space-between;
        margin: 15px 0;
        font-size: 0.9rem;
        font-weight: bold;
        color: #ff00ff;
    }

    .section-title {
        font-size: 1.2rem;
        color: #ff00ff;
        margin-bottom: 20px;
        font-family: 'Share Tech Mono', monospace;
        text-align: left;
        letter-spacing: 2px;
    }

    .profile-pic-upload {
        display: none;
    }

    .upload-pic-btn {
        margin-top: 10px;
    }

    @media(max-width: 1200px) {
        .liked-closet-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media(max-width: 768px) {
        .navbar { flex-direction: column; gap: 12px; }
        .navbar-left, .navbar-right { flex-wrap: wrap; justify-content: center; }
        .search-container { width: 100%; }
        .search-input { flex-grow: 1; width: auto; }
        .page-header { margin-top: 140px; }
        .dashboard-container { flex-direction: column; padding: 20px; }
        .dashboard-right { width: 100%; }
        .liked-closet-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<div class="crt-effect"></div>

<nav class="navbar">
    <div class="navbar-left">
        <a href="/" class="logo">STYLIX</a>
        <a href="/">HOME</a>
        <a href="/shoptest.html">SHOP</a>
        <a href="/exploreDesigners.html">DESIGNERS</a>
        <a href="/aboutus.html">ABOUT</a>
        <a href="/contact.html">CONTACT</a>
        <a href="#" id="dashboard-link" style="display: none;">MY CLOSET</a>
    </div>
    <div class="navbar-right">
        <a href="checkout.html" id="cart-btn"><i class="fas fa-shopping-cart"></i> CART</a>
        <div class="search-container">
            <span class="search-icon"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" class="search-input" placeholder="SEARCH...">
            <button id="searchActionBtn" class="search-action-btn" onclick="performSearch()">[GO]</button>
        </div>
        <div class="user-dropdown" id="user-dropdown" style="display: none;">
            <span class="greeting-text" id="user-greeting">Hello, USER</span>
            <div class="dropdown-content">
                <a href="#" id="logout-link">[LOGOUT]</a>
            </div>
        </div>
        <a href="/login.html" id="login-link">LOGIN</a>
        <a href="/register.html" id="register-link">[SIGNUP]</a>
    </div>
</nav>

<div class="page-header">
    <h1>DASHBOARD</h1>
    <div class="accent-line"></div>
</div>

<div class="dashboard-container">
    <div class="dashboard-left">
        <div class="section-title">MY CLOSET</div>
        <div class="liked-closet-grid" id="liked-items-container">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                <p>LOADING CLOSET...</p>
            </div>
        </div>
    </div>

    <div class="dashboard-right">
        <div class="dashboard-card">
            <div style="text-align: center;">
                <img src="/uploads/default-avatar.png" alt="Profile" class="profile-img" id="profile-img">
                <div class="user-name" id="user-name-display">USER</div>
                <div class="user-role">USER</div>
                <input type="file" id="profile-pic-upload" class="profile-pic-upload" accept="image/jpeg,image/png,image/jpg,image/gif,image/webp">
                <button class="dashboard-btn upload-pic-btn" id="upload-pic-btn">[ UPLOAD PROFILE ]</button>
            </div>
            <button class="dashboard-btn">VIEW PROFILE</button>
            <button class="dashboard-btn" onclick="window.location.href='/messages.html'">[ MESSAGES ]</button>
            <button class="dashboard-btn" id="logout-btn">[ LOGOUT ]</button>
        </div>

        <div class="dashboard-card">
            <div class="section-title" style="text-align: center;">CART</div>
            <div id="cart-items-display">
                <div class="checkout-item">
                    <span>NO ITEMS</span>
                    <span>$0.00</span>
                </div>
            </div>
            <hr style="border-color: rgba(255,255,255,0.2);">
            <div class="checkout-total">
                <strong>TOTAL:</strong>
                <strong id="cart-total">$0.00</strong>
            </div>
            <button class="dashboard-btn" onclick="window.location.href='/checkout.html'">[ CHECKOUT ]</button>
        </div>
    </div>
</div>

<script>
let currentUser = null;
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const searchInput = document.getElementById("searchInput");

function performSearch() {
    const query = searchInput.value;
    if (query && query.trim() !== "") {
        window.location.href = `/shoptest.html?search=${encodeURIComponent(query)}`;
    }
}

searchInput?.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        performSearch();
    }
});

const searchActionBtn = document.getElementById("searchActionBtn");
if (searchActionBtn) {
    searchActionBtn.addEventListener("click", function() {
        performSearch();
    });
}

async function loadProfilePicture() {
    try {
        const res = await fetch("/user-profile");
        const data = await res.json();
        if (data.success && data.profile && data.profile.profile_pic) {
            document.getElementById("profile-img").src = data.profile.profile_pic + "?t=" + Date.now();
        }
    } catch (error) {
        console.error("Error loading profile:", error);
    }
}

async function checkLoginStatus() {
    try {
        const res = await fetch("/check-session");
        const data = await res.json();
        
        if (data.loggedIn) {
            currentUser = data;
            document.getElementById("login-link").style.display = "none";
            document.getElementById("register-link").style.display = "none";
            document.getElementById("user-dropdown").style.display = "inline-block";
            document.getElementById("user-greeting").textContent = `Hello, ${data.userName.toUpperCase()}`;
            document.getElementById("user-name-display").textContent = data.userName.toUpperCase();
            
            const dashboardLink = document.getElementById("dashboard-link");
            if (dashboardLink) {
                if (data.accountType === 'designer') {
                    dashboardLink.href = "/designerdash.html";
                    dashboardLink.textContent = "DASHBOARD";
                } else {
                    dashboardLink.href = "/userdash.html";
                    dashboardLink.textContent = "MY CLOSET";
                }
                dashboardLink.style.display = "inline";
            }
            
            const cartBtn = document.getElementById("cart-btn");
            if (cartBtn && data.accountType === 'designer') {
                cartBtn.style.display = "none";
            }
            
            await loadProfilePicture();
            loadLikedItems();
        } else {
            currentUser = null;
            document.getElementById("login-link").style.display = "inline";
            document.getElementById("register-link").style.display = "inline";
            document.getElementById("user-dropdown").style.display = "none";
            const dashboardLink = document.getElementById("dashboard-link");
            if (dashboardLink) dashboardLink.style.display = "none";
            window.location.href = "/login.html";
        }
    } catch (error) {
        console.error("Error checking login status:", error);
    }
}

document.getElementById("upload-pic-btn")?.addEventListener("click", function() {
    document.getElementById("profile-pic-upload").click();
});

document.getElementById("profile-pic-upload")?.addEventListener("change", async function(e) {
    if (!this.files || !this.files[0]) return;
    
    const file = this.files[0];
    const formData = new FormData();
    formData.append("profile_pic", file);
    
    const reader = new FileReader();
    reader.onload = function(event) {
        document.getElementById("profile-img").src = event.target.result;
    };
    reader.readAsDataURL(file);
    
    try {
        const res = await fetch("/upload-user-profile", {
            method: "POST",
            body: formData
        });
        
        const data = await res.json();
        
        if (data.success) {
            document.getElementById("profile-img").src = data.profilePicUrl + "?t=" + Date.now();
            alert("Profile picture updated successfully!");
        } else {
            alert("Error uploading profile picture: " + (data.message || "Unknown error"));
            await loadProfilePicture();
        }
    } catch (error) {
        console.error("Upload error:", error);
        alert("Upload failed. Please try again.");
        await loadProfilePicture();
    }
});

async function loadLikedItems() {
    try {
        const res = await fetch("/liked-items");
        const data = await res.json();
        
        if (data.success && data.likedIds && data.likedIds.length > 0) {
            const itemsRes = await fetch("/items");
            const allItems = await itemsRes.json();
            const likedItems = allItems.filter(item => data.likedIds.includes(item.item_id));
            displayLikedItems(likedItems);
        } else {
            displayEmptyCloset();
        }
    } catch (error) {
        console.error("Error loading liked items:", error);
        displayEmptyCloset();
    }
}

function displayLikedItems(items) {
    const container = document.getElementById("liked-items-container");
    container.innerHTML = "";

    if (items.length === 0) {
        displayEmptyCloset();
        return;
    }

    items.forEach(item => {
        const div = document.createElement("div");
        div.classList.add("liked-item-card");

        div.innerHTML = `
            <img src="${item.image_url || 'https://via.placeholder.com/150'}" class="liked-item-img" alt="${item.item_name}">
            <div class="liked-item-name">${item.item_name.toUpperCase()}</div>
            <div class="designer-name">[${item.brand_name.toUpperCase()}]</div>
        `;
        
        container.appendChild(div);
    });
}

function displayEmptyCloset() {
    const container = document.getElementById("liked-items-container");
    container.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
            <p>CLOSET EMPTY</p>
            <button class="dashboard-btn" onclick="window.location.href='/shoptest.html'" style="margin-top: 20px;">[ EXPLORE SHOP ]</button>
        </div>
    `;
}

function updateCartDisplay() {
    const cartItems = JSON.parse(localStorage.getItem("cart")) || [];
    const cartDisplay = document.getElementById("cart-items-display");
    const cartTotal = document.getElementById("cart-total");
    
    if (cartItems.length === 0) {
        cartDisplay.innerHTML = '<div class="checkout-item"><span>NO ITEMS</span><span>$0.00</span></div>';
        cartTotal.textContent = '$0.00';
        return;
    }

    fetch("/get-cart-items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cart: cartItems })
    })
    .then(res => res.json())
    .then(data => {
        let html = '';
        let total = 0;
        
        data.items.forEach(item => {
            html += `
                <div class="checkout-item">
                    <span>${item.item_name}</span>
                    <span>$${item.price}</span>
                </div>
            `;
            total += parseFloat(item.price);
        });
        
        cartDisplay.innerHTML = html;
        cartTotal.textContent = `$${total.toFixed(2)}`;
    })
    .catch(error => {
        console.error("Error loading cart:", error);
    });
}

document.addEventListener("DOMContentLoaded", function() {
    const logoutLink = document.getElementById("logout-link");
    if (logoutLink) {
        logoutLink.addEventListener("click", async function(e) {
            e.preventDefault();
            e.stopPropagation();
            try {
                const res = await fetch("/logout", { method: "POST" });
                const data = await res.json();
                if (data.success) {
                    window.location.href = "/";
                }
            } catch (error) {
                console.error("Logout error:", error);
            }
        });
    }

    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
        logoutBtn.addEventListener("click", async function() {
            try {
                const res = await fetch("/logout", { method: "POST" });
                const data = await res.json();
                if (data.success) {
                    window.location.href = "/";
                }
            } catch (error) {
                console.error("Logout error:", error);
            }
        });
    }
});

checkLoginStatus().then(() => {
    updateCartDisplay();
});

window.addEventListener('storage', function(e) {
    if (e.key === 'cart') {
        updateCartDisplay();
    }
});
</script>
</body>
</html>
