<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>STYLIX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            src: url(fonts/YAGIZA__.TTF);
            font-family: YAGIZA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Space Mono', 'Share Tech Mono', monospace;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 0;
        }

        .crt-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            z-index: 1000;
            border-bottom: 1px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .navbar-left .logo {
            font-family: 'YAGIZA', 'Share Tech Mono', monospace;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 4px;
            text-shadow: 0 0 5px #ffffff;
        }

        .navbar-left .logo span {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }

        .navbar-left a, .navbar-right a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
            position: relative;
        }

        .navbar-left a::before, .navbar-right a::before {
            content: '>';
            position: absolute;
            left: -12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .navbar-left a:hover::before, .navbar-right a:hover::before {
            opacity: 1;
        }

        .navbar-left a:hover, .navbar-right a:hover {
            color: #ff00ff;
            padding-left: 8px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .search-container {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            padding: 5px 5px 5px 15px;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .search-icon {
            color: #ffffff;
            font-size: 0.9rem;
        }

        .search-input {
            background: transparent;
            border: none;
            padding: 8px 10px;
            color: #ffffff;
            font-size: 0.85rem;
            width: 180px;
            outline: none;
            font-family: 'Space Mono', monospace;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-action-btn {
            background: #ffffff;
            border: none;
            color: #0a0a0a;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.3s ease;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-action-btn:hover {
            background: #ff00ff;
            color: #0a0a0a;
            box-shadow: 0 0 10px #ff00ff;
        }

        .user-dropdown {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .greeting-text {
            color: #ffffff;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 10px;
            background: #0a0a0a;
            min-width: 140px;
            border: 1px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 1000;
            overflow: hidden;
        }

        .dropdown-content a {
            color: #ffffff;
            padding: 12px 20px;
            display: block;
            font-size: 0.8rem;
        }

        .dropdown-content a:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ff00ff;
        }

        .user-dropdown:hover .dropdown-content {
            display: block;
        }

        #cart-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .page-header {
            text-align: center;
            margin: 100px 0 40px;
            position: relative;
            z-index: 1;
        }

        .page-header h1 {
            font-size: 2.5rem;
            font-weight: 400;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .page-header .accent-line {
            width: 80px;
            height: 2px;
            background: #ff00ff;
            margin: 15px auto 0;
            box-shadow: 0 0 5px #ff00ff;
        }

        .profile-container {
            display: flex;
            gap: 40px;
            padding: 20px 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .profile-sidebar {
            width: 300px;
            flex-shrink: 0;
        }

        .profile-card {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #ffffff;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .profile-card:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
            transform: translateY(-5px);
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 3px solid #ff00ff;
        }

        .profile-name {
            font-size: 1.3rem;
            color: #ff00ff;
            margin-bottom: 10px;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 2px;
        }

        .profile-email {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            word-break: break-all;
        }

        .profile-role {
            font-size: 0.7rem;
            color: #ff00ff;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        .listings-section {
            flex: 1;
            min-width: 300px;
        }

        .listings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .listings-search {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .listings-search-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 5px;
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            width: 220px;
            outline: none;
            transition: all 0.3s;
        }

        .listings-search-input:focus {
            border-bottom-color: #ff00ff;
        }

        .listings-search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .listings-stats {
            font-size: 0.7rem;
            color: #ff00ff;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
        }

        .listings-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .listing-card {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .listing-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: left 0.5s;
        }

        .listing-card:hover::before {
            left: 100%;
        }

        .listing-card:hover {
            transform: translateY(-5px);
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .listing-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            filter: grayscale(20%) contrast(110%);
            transition: all 0.5s ease;
        }

        .listing-card:hover .listing-image {
            filter: grayscale(0%) contrast(120%);
        }

        .listing-content {
            padding: 15px;
        }

        .listing-title {
            font-size: 0.85rem;
            font-weight: 400;
            margin: 0 0 8px 0;
            color: #ffffff;
            letter-spacing: 1px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
        }

        .listing-category {
            color: #ff00ff;
            margin: 5px 0;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Share Tech Mono', monospace;
        }

        .listing-price {
            color: #ffffff;
            margin: 8px 0;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
        }

        .listing-details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .listing-detail-item {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.6);
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
        }

        .listing-detail-item strong {
            color: #ff00ff;
        }

        .no-listings {
            grid-column: 1/-1;
            text-align: center;
            padding: 60px;
            color: rgba(255,255,255,0.5);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 2px;
        }

        @media(max-width: 1200px) {
            .listings-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media(max-width: 900px) {
            .profile-container { flex-direction: column; }
            .profile-sidebar { width: 100%; max-width: 400px; margin: 0 auto; }
            .listings-grid { grid-template-columns: repeat(2, 1fr); }
            .navbar { padding: 12px 20px; }
            .navbar-left { gap: 20px; }
            .navbar-left .logo { font-size: 1.4rem; }
        }

        @media(max-width: 768px) {
            .navbar { flex-direction: column; gap: 12px; }
            .navbar-left, .navbar-right { flex-wrap: wrap; justify-content: center; }
            .search-container { width: 100%; }
            .search-input { flex-grow: 1; width: auto; }
            .page-header { margin-top: 140px; }
            .listings-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="crt-effect"></div>

<nav class="navbar">
    <div class="navbar-left">
        <a href="/" class="logo">STYLIX</a>
        <a href="/">HOME</a>
        <a href="/shoptest.html">SHOP</a>
        <a href="/exploreDesigners.html">DESIGNERS</a>
        <a href="/aboutus.html">ABOUT</a>
        <a href="/contact.html">CONTACT</a>
        <a href="#" id="dashboard-link" style="display: none;">MY CLOSET</a>
    </div>
    <div class="navbar-right">
        <a href="checkout.html" id="cart-btn"><i class="fas fa-shopping-cart"></i> CART</a>
        <div class="search-container">
            <span class="search-icon"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" class="search-input" placeholder="SEARCH...">
            <button id="searchActionBtn" class="search-action-btn" onclick="performSearch()">[GO]</button>
        </div>
        <div class="user-dropdown" id="user-dropdown" style="display: none;">
            <span class="greeting-text" id="user-greeting">Hello, USER</span>
            <div class="dropdown-content">
                <a href="#" id="logout-link">[LOGOUT]</a>
            </div>
        </div>
        <a href="/login.html" id="login-link">LOGIN</a>
        <a href="/register.html" id="register-link">[SIGNUP]</a>
    </div>
</nav>

<div class="page-header">
    <h1>DESIGNER PROFILE</h1>
    <div class="accent-line"></div>
</div>

<div class="profile-container">
    <div class="profile-sidebar">
        <div class="profile-card">
            <img src="/uploads/default-avatar.png" alt="Designer Avatar" class="profile-avatar" id="designer-avatar">
            <div class="profile-name" id="designer-name">LOADING...</div>
            <div class="profile-email" id="designer-email">loading@example.com</div>
            <div class="profile-role">DESIGNER</div>
        </div>
    </div>

    <div class="listings-section">
        <div class="listings-header">
            <div class="listings-search">
                <input type="text" id="searchListings" class="listings-search-input" placeholder="SEARCH LISTINGS...">
            </div>
            <div id="listings-stats" class="listings-stats">LOADING...</div>
        </div>
        <div id="listings-container" class="listings-grid">
            <div class="no-listings">LOADING LISTINGS...</div>
        </div>
    </div>
</div>

<script>
let currentUser = null;
let allListings = [];
let designerId = null;

const searchInput = document.getElementById("searchInput");
function performSearch() {
    const query = searchInput.value;
    if (query && query.trim() !== "") {
        window.location.href = `/shoptest.html?search=${encodeURIComponent(query)}`;
    }
}

searchInput?.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        event.preventDefault();
        performSearch();
    }
});

const searchActionBtn = document.getElementById("searchActionBtn");
if (searchActionBtn) {
    searchActionBtn.addEventListener("click", function() {
        performSearch();
    });
}

async function checkLoginStatus() {
    try {
        const res = await fetch("/check-session");
        const data = await res.json();
        
        if (data.loggedIn) {
            currentUser = data;
            document.getElementById("login-link").style.display = "none";
            document.getElementById("register-link").style.display = "none";
            document.getElementById("user-dropdown").style.display = "inline-block";
            document.getElementById("user-greeting").textContent = `Hello, ${data.userName.toUpperCase()}`;
            
            const dashboardLink = document.getElementById("dashboard-link");
            if (dashboardLink) {
                if (data.accountType === 'designer') {
                    dashboardLink.href = "/designerdash.html";
                    dashboardLink.textContent = "DASHBOARD";
                } else {
                    dashboardLink.href = "/userdash.html";
                    dashboardLink.textContent = "MY CLOSET";
                }
                dashboardLink.style.display = "inline";
            }
            
            const cartBtn = document.getElementById("cart-btn");
            if (cartBtn && data.accountType === 'designer') {
                cartBtn.style.display = "none";
            }
        } else {
            currentUser = null;
            document.getElementById("login-link").style.display = "inline";
            document.getElementById("register-link").style.display = "inline";
            document.getElementById("user-dropdown").style.display = "none";
            const dashboardLink = document.getElementById("dashboard-link");
            if (dashboardLink) dashboardLink.style.display = "none";
        }
    } catch (error) {
        console.error("Error checking login status:", error);
    }
}

async function loadDesignerProfile() {
    const urlParams = new URLSearchParams(window.location.search);
    designerId = urlParams.get('id');
    
    if (!designerId) {
        document.getElementById("designer-name").textContent = "DESIGNER NOT FOUND";
        document.getElementById("designer-email").textContent = "Invalid designer ID";
        return;
    }
    
    try {
        const res = await fetch(`/designer/${designerId}`);
        const designer = await res.json();
        
        document.getElementById("designer-name").textContent = designer.brand_name.toUpperCase();
        document.getElementById("designer-email").textContent = designer.brand_email;
        
        if (designer.profile_pic) {
            document.getElementById("designer-avatar").src = designer.profile_pic;
        }
        
        await loadDesignerListings();
    } catch (error) {
        console.error("Error loading designer profile:", error);
        document.getElementById("designer-name").textContent = "ERROR LOADING";
        document.getElementById("designer-email").textContent = "Please try again later";
    }
}

async function loadDesignerListings() {
    try {
        const res = await fetch(`/designer/projects/${designerId}`);
        const listings = await res.json();
        allListings = listings;
        renderListings(allListings);
    } catch (error) {
        console.error("Error loading listings:", error);
        document.getElementById("listings-container").innerHTML = '<div class="no-listings">ERROR LOADING LISTINGS</div>';
        document.getElementById("listings-stats").textContent = "ERROR";
    }
}

function renderListings(listings) {
    const container = document.getElementById("listings-container");
    const stats = document.getElementById("listings-stats");
    
    if (listings.length === 0) {
        container.innerHTML = '<div class="no-listings">NO LISTINGS AVAILABLE</div>';
        stats.textContent = "0 ITEMS";
        return;
    }
    
    stats.textContent = `${listings.length} ITEM(S)`;
    
    container.innerHTML = listings.map(listing => `
        <div class="listing-card" onclick="window.location.href='/shoptest.html'">
            <img src="${listing.image_url || 'https://via.placeholder.com/300x200?text=NO+IMAGE'}" class="listing-image" onerror="this.src='https://via.placeholder.com/300x200?text=NO+IMAGE'">
            <div class="listing-content">
                <div class="listing-title">${listing.item_name.toUpperCase()}</div>
                <div class="listing-category">[${listing.category.toUpperCase()}]</div>
                <div class="listing-price">$${Number(listing.price).toFixed(2)}</div>
                <div class="listing-details">
                    <div class="listing-detail-item">
                        <span>STYLE:</span>
                        <strong>${listing.style}</strong>
                    </div>
                    <div class="listing-detail-item">
                        <span>INVENTORY:</span>
                        <strong>${listing.inventory}</strong>
                    </div>
                    <div class="listing-detail-item">
                        <span>SIZE:</span>
                        <strong>${listing.size_range}</strong>
                    </div>
                </div>
            </div>
        </div>
    `).join("");
}

function searchListings() {
    const query = document.getElementById("searchListings").value.toLowerCase();
    const filtered = allListings.filter(listing =>
        listing.item_name.toLowerCase().includes(query) ||
        listing.category.toLowerCase().includes(query) ||
        listing.style.toLowerCase().includes(query)
    );
    renderListings(filtered);
}

document.getElementById("searchListings").addEventListener("input", searchListings);

document.addEventListener("DOMContentLoaded", function() {
    const logoutLink = document.getElementById("logout-link");
    if (logoutLink) {
        logoutLink.addEventListener("click", async function(e) {
            e.preventDefault();
            e.stopPropagation();
            try {
                const res = await fetch("/logout", { method: "POST" });
                const data = await res.json();
                if (data.success) {
                    window.location.reload();
                }
            } catch (error) {
                console.error("Logout error:", error);
            }
        });
    }
});

checkLoginStatus().then(() => {
    loadDesignerProfile();
});
</script>
</body>
</html>
